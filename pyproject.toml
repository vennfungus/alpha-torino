[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venntorino-causal-lm"
version = "0.1.0"
description = "A small PyTorch causal language model project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
